<!doctype html>
<html lang="en" style="background-color:#090a0c">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TV Music Store — Royalty-Free Cinematic Music Licensing for YouTube, Ads & Film</title>
    <meta
      name="description"
      content="Royalty-free cinematic and production music for YouTube, ads, films, trailers and games. Subscriptions from $7/mo (Pro) and $15/mo (Max) with WAV, stems and commercial licensing, plus one-time track licenses."
    />
    <meta name="author" content="TV Music Store" />
    <!-- iOS Safari turns a bare email in plain text into a tap-to-open mailto.
         Nobody wants to email themselves from their own account menu. -->
    <meta name="format-detection" content="telephone=no, date=no, email=no, address=no" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0e0e10" />
    <meta
      name="keywords"
      content="royalty free music, royalty free music subscription, cinematic music licensing, music for youtube, production music, trailer music, background music for videos, commercial music license, WAV stems, youtube content id claim release"
    />
    <link rel="canonical" href="https://tvmusicstore.com/" />

    <!-- Fonts are SELF-HOSTED (public/fonts) and the visible weights are
         preloaded, so they arrive before first paint — no font flash, no
         Google Fonts round-trip. @font-face lives in src/index.css. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin-400-normal.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin-600-normal.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/outfit-latin-700-normal.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/outfit-latin-800-normal.woff2" crossorigin />
    <!-- The header logo used to pop in a frame late — fetch it with the page. -->
    <link rel="preload" as="image" href="/images/icons/logo-header.png" />

    <link rel="icon" type="image/x-icon" href="/images/icons/favicon.ico" />
    <link rel="icon" type="image/png" sizes="96x96" href="/images/icons/favicon-96x96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/icons/apple-touch-icon.png" />

    <meta property="og:site_name" content="TV Music Store" />
    <meta property="og:title" content="TV Music Store — Royalty-Free Cinematic Music Licensing" />
    <meta
      property="og:description"
      content="Royalty-free cinematic and production music for YouTube, ads, films, trailers and games. Subscriptions from $7/mo with WAV, stems and commercial licensing."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tvmusicstore.com/" />
    <!-- Full-bleed 1200x630 branded banner (MINIMAL: dark graphite + gold logo
         + wordmark — owner's pick 2026-07-24) for Telegram/social link previews.
         Source file: public/images/og-cover-2.jpg (the cinema-hall og-cover.jpg
         stays on disk as an alternative). After changing it, bump the filename
         (og-cover-3.jpg) so messengers re-fetch instead of serving their cache. -->
    <meta property="og:image" content="https://tvmusicstore.com/images/og-cover-2.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="TV Music Store — Premium Cinematic Music Licensing" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TV Music Store — Royalty-Free Cinematic Music Licensing" />
    <meta
      name="twitter:description"
      content="Royalty-free cinematic and production music for YouTube, ads, films, trailers and games. Subscriptions with WAV, stems and commercial licensing."
    />
    <meta name="twitter:image" content="https://tvmusicstore.com/images/og-cover-2.jpg" />

    <!-- Structured data: readable by search engines AND JS-less bots (ChatGPT, social) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://tvmusicstore.com/#organization",
            "name": "TV Music Store",
            "url": "https://tvmusicstore.com/",
            "logo": "https://tvmusicstore.com/images/icons/web-app-manifest-512x512.png",
            "description": "Independent music licensing house working with its own composers to create original cinematic and production music, licensed directly to creators, brands and studios. Not a reseller or marketplace for third-party stock content."
          },
          {
            "@type": "WebSite",
            "@id": "https://tvmusicstore.com/#website",
            "url": "https://tvmusicstore.com/",
            "name": "TV Music Store",
            "publisher": { "@id": "https://tvmusicstore.com/#organization" },
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://tvmusicstore.com/catalog?search={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          },
          {
            "@type": "Product",
            "name": "TV Music Store — Royalty-Free Music Subscription",
            "description": "Unlimited royalty-free music downloads with commercial licensing, WAV + stems and Content ID claim support.",
            "brand": { "@id": "https://tvmusicstore.com/#organization" },
            "offers": [
              {
                "@type": "Offer",
                "name": "Pro plan",
                "price": "7.00",
                "priceCurrency": "USD",
                "description": "Unlimited MP3 downloads and a personal & small-team license. $7/mo billed annually.",
                "url": "https://tvmusicstore.com/pricing"
              },
              {
                "@type": "Offer",
                "name": "Max plan",
                "price": "15.00",
                "priceCurrency": "USD",
                "description": "Commercial license for ads & client work, WAV + stems, priority support. $15/mo billed annually.",
                "url": "https://tvmusicstore.com/pricing"
              }
            ]
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Can I use the music on YouTube, in ads and for client work?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. Free and Pro cover personal and small-team use including YouTube, podcasts and websites. Max adds commercial use: paid ads, sponsored content, client work and brands of any size. One-time Sync licenses cover TV, film, trailers and games."
                }
              },
              {
                "@type": "Question",
                "name": "What is the difference between the Pro and Max plans?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Pro gives unlimited MP3 downloads and a personal & small-team license. Max adds WAV + stems, a full commercial license (ads and client work) and priority support."
                }
              },
              {
                "@type": "Question",
                "name": "What audio formats do I get?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "MP3 on every plan. Lossless WAV and isolated stems are included with the Max plan and with one-time Professional and Commercial track licenses."
                }
              },
              {
                "@type": "Question",
                "name": "What happens if I get a YouTube Content ID claim?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "A claim is a notice, not a strike — it does not harm your channel. Paste the video link in your account and tell us which track it is: we send the claim for release within one business day, on any plan including Free."
                }
              },
              {
                "@type": "Question",
                "name": "Can I buy a license for a single track?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. One-time track licenses are available: Personal $15, Commercial $79 and Professional $249. Each purchase includes a PDF license certificate. Pay once, licensed forever."
                }
              }
            ]
          }
        ]
      }
    </script>

    <!-- CRITICAL app-shell CSS (inline so it applies on the FIRST paint, before
         the built CSS chunk loads). This is what removes the cold-load flicker:
         the dark background + the header bar with the logo are painted from
         frame 1, in the SAME position the real <Navigation> will occupy, so
         nothing flashes white and nothing "pops in". React's createRoot()
         replaces #root's children on its first commit, so the shell disappears
         the moment the app is ready — no JS, no timers, no fade needed. -->
    <style>
      html, body { background-color: #090a0c; }
      body { margin: 0; }
      #app-shell {
        position: fixed;
        inset: 0;
        background-color: #090a0c;
        z-index: 0;
      }
      #app-shell .shell-nav {
        position: fixed;
        top: 0; left: 0; right: 0;
        height: 64px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        background-color: rgba(9, 10, 12, 0.85);
      }
      #app-shell .shell-nav-inner {
        max-width: 80rem;
        height: 100%;
        margin: 0 auto;
        display: flex;
        align-items: center;
        padding: 0 16px;
      }
      #app-shell .shell-logo {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #fafafa;
        font-family: 'Inter', 'Inter Fallback', Arial, sans-serif;
        font-size: 14px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.22em;
        line-height: 1;
        white-space: nowrap;
      }
      #app-shell .shell-logo img {
        height: 32px;
        width: auto;
        display: block;
      }
      @media (min-width: 640px) {
        #app-shell .shell-nav-inner { padding: 0 24px; }
      }
      @media (min-width: 768px) {
        #app-shell .shell-nav { height: 80px; }
        #app-shell .shell-logo { font-size: 16px; }
        #app-shell .shell-logo img { height: 36px; }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <!-- Static shell: shown from the very first paint until React mounts and
           replaces it. Matches the real header geometry so the logo does not
           move when the app takes over. aria-hidden so it never reaches AT. -->
      <div id="app-shell" aria-hidden="true">
        <header class="shell-nav">
          <div class="shell-nav-inner">
            <span class="shell-logo">
              <img src="/images/icons/logo-header.png" alt="" />
              TV Music Store
            </span>
          </div>
        </header>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
